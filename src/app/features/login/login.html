<div id="Background">

<section id="Back_Login">
<h2>Inicio de Sesión</h2>

<form [formGroup]="LoginForm" (ngSubmit)="onLogin()">
    <label for="username">Usuario:</label>
    <input type="text" formControlName="username" placeholder="Usuario">
    <label for="password">Contraseña:</label>
    <input type="password" formControlName="password" placeholder="Contraseña">
    <button type="submit"[disabled]="LoginForm.invalid">Iniciar Sesión</button>
</form>

<h2>Registrarse</h2>

<form [formGroup]="RegisterForm" (ngSubmit)="onRegister()">
    <label for="username">Crear Usuario:</label>
    <input type="text" formControlName="username" placeholder="Nuevo usuario">
    <label for="password">Crear Contraseña:</label>
    <input type="password" formControlName="password" placeholder="Nueva contraseña">
    <label for="Asignar Rol"></label>
    <button type="button" (click)="setRole('CLIENT')">Asignar Rol: CLIENT</button>
    <button type="button" (click)="setRole('ADMIN')">Asignar Rol: ADMIN</button>

    <button type="submit"[disabled]="RegisterForm.invalid">Crear Cuenta</button>
</form>

</section>

</div>
